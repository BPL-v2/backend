name: Deploy (Staging)

on:
  push:
    branches:
      - develop

env:
  IMAGE: ghcr.io/bpl-v2/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test -count=1 ./...

  migrations:
    name: Validate migrations on empty database
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.20.3-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run migrations up
        run: |
          goose -dir migrations postgres \
            "host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=disable search_path=bpl2,public" \
            up

      - name: Show migration status
        run: |
          goose -dir migrations postgres \
            "host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=disable search_path=bpl2,public" \
            status

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:sha-${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE }}:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [test, migrations, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag staging from build image
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:staging \
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Notify watchtower on staging
        run: |
          curl -f -X POST "${{ vars.STAGING_SERVER_URL }}/watchtower/v1/update" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_STAGING_TOKEN }}"