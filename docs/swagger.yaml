components:
  schemas:
    Character:
      properties:
        class:
          type: string
        current:
          description: Current always true if present
          type: boolean
        deleted:
          description: Deleted always true if present
          type: boolean
        equipment:
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
        experience:
          type: integer
        expired:
          description: Expired always true if present
          type: boolean
        guardian:
          description: Guardian PoE1 only
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
        id:
          description: Id a unique 64 digit hexadecimal string
          type: string
        inventory:
          description: Inventory PoE1 only
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
        jewels:
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
        league:
          type: string
        level:
          type: integer
        metadata:
          $ref: '#/components/schemas/CharacterMetadata'
        name:
          type: string
        passives:
          $ref: '#/components/schemas/CharacterPassives'
        realm:
          $ref: '#/components/schemas/Realm'
        rucksack:
          description: Rucksack PoE1 only
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
        ruthless:
          description: Ruthless PoE1 only; always true if present
          type: boolean
        skills:
          description: Skills PoE2 only
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
      required:
      - class
      - experience
      - id
      - level
      - name
      - realm
      type: object
    CharacterMetadata:
      properties:
        version:
          description: Version game version for the character's realm
          type: string
      type: object
    CharacterPassives:
      properties:
        alternate_ascendancy:
          description: AlternateAscendancy PoE1 only; Bloodline class name
          type: string
        bandit_choice:
          $ref: '#/components/schemas/CharacterPassivesBanditChoice'
        hashes:
          items:
            type: integer
          type: array
          uniqueItems: false
        hashes_ex:
          description: HashesEx PoE1 only
          items:
            type: integer
          type: array
          uniqueItems: false
        jewel_data:
          additionalProperties:
            $ref: '#/components/schemas/ItemJewelData'
          description: JewelData the key is the string value of the x property of
            an item from the jewels array in this request
          type: object
        mastery_effects:
          additionalProperties:
            type: integer
          description: MasteryEffects PoE1 only; the key is the string value of the
            mastery node skill hash and the value is the selected effect hash
          type: object
        pantheon_major:
          $ref: '#/components/schemas/CharacterPassivesPantheonMajor'
        pantheon_minor:
          $ref: '#/components/schemas/CharacterPassivesPantheonMinor'
        quest_stats:
          description: QuestStats PoE2 only; passives granted via quests
          items:
            type: string
          type: array
          uniqueItems: false
        skill_overrides:
          additionalProperties:
            $ref: '#/components/schemas/PassiveNode'
          description: SkillOverrides the key is the string value of the node identifier
            being replaced
          type: object
        specialisations:
          additionalProperties:
            items:
              type: integer
            type: array
          description: Specialisations PoE2 only; the keys are set1, set2, and set3
          type: object
      required:
      - hashes
      - hashes_ex
      - jewel_data
      - mastery_effects
      - skill_overrides
      - specialisations
      type: object
    CharacterPassivesBanditChoice:
      description: BanditChoice PoE1 only; one of Kraityn, Alira, Oak, or Eramir
      enum:
      - Alira
      - Eramir
      - Kraityn
      - Oak
      type: string
      x-enum-varnames:
      - Alira
      - Eramir
      - Kraityn
      - Oak
    CharacterPassivesPantheonMajor:
      description: PantheonMajor PoE1 only; one of TheBrineKing, Arakaali, Solaris,
        or Lunaris
      enum:
      - Arakaali
      - Lunaris
      - Solaris
      - TheBrineKing
      type: string
      x-enum-varnames:
      - Arakaali
      - Lunaris
      - Solaris
      - TheBrineKing
    CharacterPassivesPantheonMinor:
      description: PantheonMinor PoE1 only; one of Abberath, Gruthkul, Yugul, Shakari,
        Tukohama, Ralakesh, Garukhan, or Ryslatha
      enum:
      - Abberath
      - Garukhan
      - Gruthkul
      - Ralakesh
      - Ryslatha
      - Shakari
      - Tukohama
      - Yugul
      type: string
      x-enum-varnames:
      - Abberath
      - Garukhan
      - Gruthkul
      - Ralakesh
      - Ryslatha
      - Shakari
      - Tukohama
      - Yugul
    CrucibleNode:
      properties:
        allocated:
          description: Allocated always true if present
          type: boolean
        icon:
          type: string
        in:
          description: In node identifiers of nodes connected to this one
          items:
            type: string
          type: array
          uniqueItems: false
        isNotable:
          description: IsNotable always true if present
          type: boolean
        isReward:
          description: IsReward always true if present
          type: boolean
        orbit:
          description: Orbit the column this node occupies
          type: integer
        orbitIndex:
          description: OrbitIndex the node's position within the column
          type: integer
        out:
          description: Out node identifiers of nodes this one connects to
          items:
            type: string
          type: array
          uniqueItems: false
        reminderText:
          items:
            type: string
          type: array
          uniqueItems: false
        skill:
          description: Skill mod hash
          type: integer
        stats:
          description: Stats stat descriptions
          items:
            type: string
          type: array
          uniqueItems: false
        tier:
          description: Tier mod tier
          type: integer
      required:
      - in
      - out
      type: object
    Faction:
      properties:
        id:
          $ref: '#/components/schemas/FactionId'
        name:
          type: string
      required:
      - id
      - name
      type: object
    FactionId:
      description: Id Faction1, Faction2, Faction3, or Faction4
      enum:
      - Faction1
      - Faction2
      - Faction3
      - Faction4
      type: string
      x-enum-varnames:
      - Faction1
      - Faction2
      - Faction3
      - Faction4
    GemPage:
      properties:
        description:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        skillName:
          type: string
        stats:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    GemTab:
      properties:
        name:
          type: string
        pages:
          items:
            $ref: '#/components/schemas/GemPage'
          type: array
          uniqueItems: false
      required:
      - pages
      type: object
    Item:
      properties:
        abyssJewel:
          description: AbyssJewel always true if present
          type: boolean
        additionalProperties:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        artFilename:
          type: string
        baseType:
          type: string
        bondedMods:
          description: BondedMods PoE2 only
          items:
            type: string
          type: array
          uniqueItems: false
        builtInSupport:
          description: BuiltInSupport PoE1 only; Supported by level 1 x
          type: string
        cisRaceReward:
          description: CisRaceReward always true if present
          type: boolean
        colour:
          $ref: '#/components/schemas/ItemColour'
        corrupted:
          description: Corrupted always true if present
          type: boolean
        cosmeticMods:
          items:
            type: string
          type: array
          uniqueItems: false
        crucible:
          $ref: '#/components/schemas/ItemCrucible'
        crucibleMods:
          description: CrucibleMods only allocated mods are included
          items:
            type: string
          type: array
          uniqueItems: false
        delve:
          description: Delve always true if present
          type: boolean
        descrText:
          type: string
        desecrated:
          description: Desecrated PoE2 only; always true if present
          type: boolean
        doubleCorrupted:
          description: DoubleCorrupted PoE2 only; always true if present
          type: boolean
        duplicated:
          description: Duplicated always true if present
          type: boolean
        elder:
          description: Elder always true if present
          type: boolean
        enchantMods:
          items:
            type: string
          type: array
          uniqueItems: false
        enshrouded:
          $ref: '#/components/schemas/ItemEnshrouded'
        explicitMods:
          items:
            $ref: '#/components/schemas/ItemMod'
          type: array
          uniqueItems: false
        extended:
          $ref: '#/components/schemas/ItemExtended'
        flavourText:
          items:
            type: string
          type: array
          uniqueItems: false
        flavourTextNote:
          description: FlavourTextNote user-generated text
          type: string
        foilVariation:
          type: integer
        foreseeing:
          description: Foreseeing always true if present
          type: boolean
        forum_note:
          description: ForumNote user-generated text
          type: string
        fractured:
          description: Fractured always true if present
          type: boolean
        frameType:
          description: FrameType deprecated; use frameTypeId
          type: integer
        frameTypeId:
          type: string
        gemBackground:
          description: GemBackground PoE2 only
          type: string
        gemSkill:
          description: GemSkill PoE2 only
          type: string
        gemSockets:
          description: GemSockets PoE2 only; string is always W
          items:
            type: string
          type: array
          uniqueItems: false
        gemTabs:
          description: GemTabs PoE2 only
          items:
            $ref: '#/components/schemas/GemTab'
          type: array
          uniqueItems: false
        grantedSkills:
          description: GrantedSkills PoE2 only
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        h:
          type: integer
        hybrid:
          $ref: '#/components/schemas/ItemHybrid'
        icon:
          type: string
        iconStackLevel:
          description: IconStackLevel describes the level of a stack of items
          type: string
        iconTierText:
          description: IconTierText usually roman numerals
          type: string
        id:
          description: Id a unique 64 digit hexadecimal string
          type: string
        identified:
          type: boolean
        ilvl:
          type: integer
        implicitMods:
          items:
            $ref: '#/components/schemas/ItemMod'
          type: array
          uniqueItems: false
        incubatedItem:
          $ref: '#/components/schemas/ItemIncubatedItem'
        influences:
          additionalProperties: {}
          type: object
        inventoryId:
          type: string
        isRelic:
          description: IsRelic always true if present
          type: boolean
        itemLevel:
          description: ItemLevel used for items that always display their item level
          type: integer
        league:
          type: string
        lockedToAccount:
          description: LockedToAccount always true if present
          type: boolean
        lockedToCharacter:
          description: LockedToCharacter always true if present
          type: boolean
        logbookMods:
          items:
            $ref: '#/components/schemas/ItemLogbookMod'
          type: array
          uniqueItems: false
        maxStackSize:
          type: integer
        memoryItem:
          description: MemoryItem always true if present
          type: boolean
        mercenarySkills:
          items:
            $ref: '#/components/schemas/ItemMercenarySkill'
          type: array
          uniqueItems: false
        monsterLevel:
          description: MonsterLevel PoE1 only; used for items that always display
            their monster level
          type: integer
        mutated:
          description: 'Mutated PoE1: true on Foulborn Uniques, PoE2: true on all
            Vaal Uniques'
          type: boolean
        name:
          type: string
        nextLevelRequirements:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        notableProperties:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        note:
          description: Note user-generated text
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        prophecyText:
          type: string
        rarity:
          $ref: '#/components/schemas/ItemRarity'
        realm:
          $ref: '#/components/schemas/Realm'
        replica:
          description: Replica always true if present
          type: boolean
        requirements:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        rewards:
          items:
            $ref: '#/components/schemas/ItemReward'
          type: array
          uniqueItems: false
        runeMods:
          description: RuneMods PoE2 only
          items:
            type: string
          type: array
          uniqueItems: false
        ruthless:
          description: Ruthless always true if present
          type: boolean
        sanctified:
          description: Sanctified PoE2 only; always true if present
          type: boolean
        scourgeMods:
          items:
            type: string
          type: array
          uniqueItems: false
        scourged:
          $ref: '#/components/schemas/ItemScourged'
        seaRaceReward:
          description: SeaRaceReward always true if present
          type: boolean
        searing:
          description: Searing always true if present
          type: boolean
        secDescrText:
          type: string
        shaper:
          description: Shaper always true if present
          type: boolean
        socket:
          type: integer
        socketedIcon:
          description: SocketedIcon PoE2 only; an image URL to use when this item
            is in the socket of another item
          type: string
        socketedItems:
          items:
            $ref: '#/components/schemas/Item'
          type: array
          uniqueItems: false
        sockets:
          items:
            $ref: '#/components/schemas/ItemSocket'
          type: array
          uniqueItems: false
        split:
          description: Split always true if present
          type: boolean
        stackSize:
          type: integer
        stackSizeText:
          type: string
        support:
          description: Support always true if present
          type: boolean
        supportGemRequirements:
          description: SupportGemRequirements PoE2 only
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        synthesised:
          description: Synthesised always true if present
          type: boolean
        tamedBeastProperties:
          description: TamedBeastProperties PoE2 only
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        tangled:
          description: Tangled always true if present
          type: boolean
        thRaceReward:
          description: ThRaceReward always true if present
          type: boolean
        typeLine:
          type: string
        ultimatumMods:
          items:
            $ref: '#/components/schemas/ItemUltimatumMod'
          type: array
          uniqueItems: false
        unidentifiedTier:
          description: UnidentifiedTier PoE2 only
          type: integer
        unmodifiable:
          description: Unmodifiable always true if present
          type: boolean
        unmodifiableExceptChaos:
          description: UnmodifiableExceptChaos always true if present
          type: boolean
        utilityMods:
          items:
            type: string
          type: array
          uniqueItems: false
        veiled:
          description: Veiled always true if present
          type: boolean
        veiledMods:
          description: VeiledMods random video identifier
          items:
            type: string
          type: array
          uniqueItems: false
        verified:
          type: boolean
        vestigial:
          description: Vestigial PoE1 only; always true if present
          type: boolean
        w:
          type: integer
        weaponRequirements:
          description: WeaponRequirements PoE2 only
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        x:
          type: integer
        "y":
          type: integer
      required:
      - baseType
      - frameTypeId
      - h
      - icon
      - identified
      - ilvl
      - name
      - typeLine
      - verified
      - w
      type: object
    ItemColour:
      description: Colour PoE1 only; S, D, I, or G
      enum:
      - D
      - G
      - I
      - S
      type: string
      x-enum-varnames:
      - ItemColourD
      - ItemColourG
      - ItemColourI
      - ItemColourS
    ItemCrucible:
      properties:
        layout:
          description: Layout URL to an image of the tree layout
          type: string
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/CrucibleNode'
          description: Nodes the key is the string value of the node index
          type: object
      required:
      - layout
      - nodes
      type: object
    ItemEnshrouded:
      properties:
        progress:
          type: integer
        total:
          type: integer
        unique:
          type: string
      required:
      - progress
      - total
      type: object
    ItemExtended:
      description: Extended only present in the Public Stash API
      properties:
        prefixes:
          type: integer
        suffixes:
          type: integer
      type: object
    ItemHybrid:
      properties:
        baseTypeName:
          type: string
        explicitMods:
          items:
            type: string
          type: array
          uniqueItems: false
        isVaalGem:
          type: boolean
        properties:
          items:
            $ref: '#/components/schemas/ItemProperty'
          type: array
          uniqueItems: false
        secDescrText:
          type: string
      required:
      - baseTypeName
      type: object
    ItemIncubatedItem:
      properties:
        level:
          description: Level monster level required to progress
          type: integer
        name:
          type: string
        progress:
          type: integer
        total:
          type: integer
      required:
      - level
      - name
      - progress
      - total
      type: object
    ItemJewelData:
      properties:
        radius:
          type: integer
        radiusMin:
          type: integer
        radiusVisual:
          type: string
        subgraph:
          $ref: '#/components/schemas/ItemJewelDataSubgraph'
        type:
          type: string
      required:
      - type
      type: object
    ItemJewelDataSubgraph:
      description: Subgraph only present on cluster jewels
      properties:
        groups:
          additionalProperties:
            $ref: '#/components/schemas/PassiveGroup'
          description: Groups the key is the string value of the group id
          type: object
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/PassiveNode'
          description: Nodes the key is the string value of the node identifier
          type: object
      required:
      - groups
      - nodes
      type: object
    ItemLogbookMod:
      properties:
        faction:
          $ref: '#/components/schemas/Faction'
        name:
          description: Name area name
          type: string
      required:
      - faction
      - name
      type: object
    ItemMercenarySkill:
      properties:
        hash:
          type: integer
        icon:
          type: string
        name:
          type: string
        supports:
          items:
            $ref: '#/components/schemas/Support'
          type: array
          uniqueItems: false
      required:
      - hash
      - icon
      - name
      type: object
    ItemMod:
      properties:
        description:
          type: string
        flags:
          $ref: '#/components/schemas/ItemModFlags'
      required:
      - description
      type: object
    ItemModFlags:
      properties:
        crafted:
          description: Crafted always true if present
          type: boolean
        desecrated:
          description: Desecrated PoE2 only; always true if present
          type: boolean
        fractured:
          description: Fractured always true if present
          type: boolean
        mutated:
          description: Mutated always true if present
          type: boolean
        vestigial:
          description: Vestigial PoE1 only; always true if present
          type: boolean
      type: object
    ItemProperty:
      properties:
        displayMode:
          type: integer
        icon:
          type: string
        name:
          type: string
        progress:
          description: Progress rounded to 2 decimal places
          type: number
        suffix:
          type: string
        type:
          type: integer
        values:
          items:
            items: {}
            type: array
          type: array
          uniqueItems: false
      required:
      - name
      - values
      type: object
    ItemRarity:
      description: Rarity Normal, Magic, Rare, or Unique
      enum:
      - Magic
      - Normal
      - Rare
      - Unique
      type: string
      x-enum-varnames:
      - ItemRarityMagic
      - ItemRarityNormal
      - ItemRarityRare
      - ItemRarityUnique
    ItemReward:
      properties:
        label:
          type: string
        rewards:
          additionalProperties:
            type: integer
          description: Rewards the key is a string representing the type of reward.
            The value is the amount
          type: object
      required:
      - label
      - rewards
      type: object
    ItemScourged:
      properties:
        level:
          description: Level monster level required to progress
          type: integer
        progress:
          type: integer
        tier:
          description: Tier 1-3 for items, 1-10 for maps
          type: integer
        total:
          type: integer
      required:
      - tier
      type: object
    ItemSocket:
      properties:
        attr:
          $ref: '#/components/schemas/ItemSocketAttr'
        group:
          type: integer
        item:
          $ref: '#/components/schemas/ItemSocketItem'
        sColour:
          $ref: '#/components/schemas/ItemSocketSColour'
        type:
          $ref: '#/components/schemas/ItemSocketType'
      required:
      - group
      type: object
    ItemSocketAttr:
      description: Attr PoE1 only; S, D, I, G, A, or DV
      enum:
      - A
      - D
      - DV
      - G
      - I
      - S
      type: string
      x-enum-varnames:
      - ItemSocketAttrA
      - ItemSocketAttrD
      - ItemSocketAttrDV
      - ItemSocketAttrG
      - ItemSocketAttrI
      - ItemSocketAttrS
    ItemSocketItem:
      description: Item PoE2 only; emerald, sapphire, ruby, rune, soulcore, primaltalisman,
        vividtalisman, wildtalisman, sacredtalisman, activegem, or supportgem
      enum:
      - activegem
      - emerald
      - primaltalisman
      - ruby
      - rune
      - sacredtalisman
      - sapphire
      - soulcore
      - supportgem
      - vividtalisman
      - wildtalisman
      type: string
      x-enum-varnames:
      - ItemSocketItemActivegem
      - ItemSocketItemEmerald
      - ItemSocketItemPrimaltalisman
      - ItemSocketItemRuby
      - ItemSocketItemRune
      - ItemSocketItemSacredtalisman
      - ItemSocketItemSapphire
      - ItemSocketItemSoulcore
      - ItemSocketItemSupportgem
      - ItemSocketItemVividtalisman
      - ItemSocketItemWildtalisman
    ItemSocketSColour:
      description: SColour PoE1 only; R, G, B, W, A, or DV
      enum:
      - A
      - B
      - DV
      - G
      - R
      - W
      type: string
      x-enum-varnames:
      - ItemSocketSColourA
      - ItemSocketSColourB
      - ItemSocketSColourDV
      - ItemSocketSColourG
      - ItemSocketSColourR
      - ItemSocketSColourW
    ItemSocketType:
      description: Type PoE2 only; gem, jewel, or rune
      enum:
      - gem
      - jewel
      - rune
      type: string
      x-enum-varnames:
      - ItemSocketTypeGem
      - ItemSocketTypeJewel
      - ItemSocketTypeRune
    ItemUltimatumMod:
      properties:
        tier:
          type: integer
        type:
          description: Type text used to display ultimatum icons
          type: string
      required:
      - tier
      - type
      type: object
    PassiveGroup:
      properties:
        isProxy:
          description: IsProxy always true if present
          type: boolean
        nodes:
          description: Nodes the node identifiers associated with this group
          items:
            type: string
          type: array
          uniqueItems: false
        orbits:
          items:
            type: integer
          type: array
          uniqueItems: false
        proxy:
          description: Proxy identifier of the placeholder node
          type: string
        x:
          type: number
        "y":
          type: number
      required:
      - nodes
      - orbits
      - x
      - "y"
      type: object
    PassiveNode:
      properties:
        activeEffectImage:
          description: ActiveEffectImage active mastery or tattoo background image
          type: string
        activeIcon:
          description: ActiveIcon active mastery image
          type: string
        ascendancyName:
          type: string
        classStartIndex:
          type: integer
        expansionJewel:
          $ref: '#/components/schemas/PassiveNodeExpansionJewel'
        flavourText:
          items:
            type: string
          type: array
          uniqueItems: false
        grantedDexterity:
          description: GrantedDexterity sum of stats on this node that grant dexterity
          type: integer
        grantedIntelligence:
          description: GrantedIntelligence sum of stats on this node that grant intelligence
          type: integer
