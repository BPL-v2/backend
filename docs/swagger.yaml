externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: Liberatorist@gmail.com
    name: Liberator
  description: This is the backend API for the BPL project.
  title: BPL Backend API
  version: "2.0"
openapi: 3.1.0
paths:
  /{eventId}/guilds:
    get:
      description: Get all guilds for current event with their respective team ids
      operationId: GetGuilds
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Guild'
                type: array
          description: OK
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /{eventId}/guilds/{guildId}:
    put:
      description: Saves a guild for the current event
      operationId: SaveGuild
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Guild Id
        in: path
        name: guildId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guild'
              description: Guild
              summary: guild
        description: Guild
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
          description: OK
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /{eventId}/guilds/{guildId}/stash-history:
    get:
      description: Fetches log entries for a guild in an event
      operationId: GetLogEntriesForGuild
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Guild Id
        in: path
        name: guildId
        required: true
        schema:
          type: integer
      - description: Limit
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset
        in: query
        name: offset
        schema:
          type: integer
      - description: Name of the user doing the action (Make sure to replace the pound
          sign with a minus)
        in: query
        name: username
        schema:
          type: string
      - description: Name of the item (Can be partial)
        in: query
        name: itemname
        schema:
          type: string
      - description: Name of the stash tab
        in: query
        name: stashname
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GuildStashChangelog'
                type: array
          description: OK
      security:
      - BearerAuth: []
      tags:
      - guild-stash
    post:
      description: Adds a new entry to the guild stash history
      operationId: AddGuildstashHistory
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Guild Id
        in: path
        name: guildId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildStashChangeResponse'
              description: Request body
              summary: guildStashChanges
        description: Request body
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddGuildStashHistoryResponse'
          description: Created
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /{eventId}/guilds/{guildId}/stash-history/latest_timestamp:
    get:
      description: Fetches the latest timestamp for a user's guild stash history
      operationId: GetLatestTimestampForUser
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Guild Id
        in: path
        name: guildId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildStashLogTimestampResponse'
          description: OK
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /{eventId}/teams/{teamId}/guild-stash:
    get:
      description: Fetches all guild stash tabs for a user
      operationId: GetGuildStashForUser
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Team Id
        in: path
        name: teamId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GuildStashTab'
                type: array
          description: OK
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /{eventId}/teams/{teamId}/guild-stash/{stash_id}:
    get:
      description: Fetches a specific guild stash tab
      operationId: GetGuildStashTab
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Team Id
        in: path
        name: teamId
        required: true
        schema:
          type: integer
      - description: Stash Tab Id
        in: path
        name: stash_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StashTabWithCompletions'
          description: OK
      security:
      - BearerAuth: []
      tags:
      - guild-stash
    patch:
      description: Enables fetching for a specific guild stash tab
      operationId: SwitchStashFetching
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Team Id
        in: path
        name: teamId
        required: true
        schema:
          type: integer
      - description: Stash Tab Id
        in: path
        name: stash_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TabSwitchRequest'
              description: Request body
              summary: body
        description: Request body
        required: true
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /{eventId}/teams/{teamId}/guild-stash/{stash_id}/update:
    post:
      description: Fetches current items for specific guild stash tab
      operationId: UpdateStashTab
      parameters:
      - description: Event Id
        in: path
        name: eventId
        required: true
        schema:
          type: integer
      - description: Team Id
        in: path
        name: teamId
        required: true
        schema:
          type: integer
      - description: Stash Tab Id
        in: path
        name: stash_id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      tags:
      - guild-stash
  /achievements:
    get:
      operationId: getAchievements
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AchievementResponse'
                type: array
          description: OK
      summary: List achievement definitions
      tags:
      - Achievement
    post:
      operationId: createAchievement
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/AchievementCreate'
                description: Achievement to create
                summary: body
        description: Achievement to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementResponse'
          description: Created
      security:
      - BearerAuth: []
      summary: Create a custom achievement
      tags:
      - Achievement
  /achievements/{achievement_id}:
    delete:
      operationId: deleteAchievement
      parameters:
      - description: Achievement ID
        in: path
        name: achievement_id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a custom achievement
      tags:
      - Achievement
    patch:
      operationId: updateAchievement
      parameters:
      - description: Achievement ID
        in: path
        name: achievement_id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/AchievementCreate'
                description: Updated fields
                summary: body
        description: Updated fields
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Update a custom achievement
      tags:
      - Achievement
  /achievements/{achievement_id}/icon:
    get:
      operationId: getIcon
      parameters:
      - description: Achievement ID
        in: path
        name: achievement_id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            image/*:
              schema:
                type: string
          description: OK
      summary: Get the icon for an achievement
      tags:
      - Achievement
    put:
      operationId: uploadIcon
      parameters:
      - description: Achievement ID
        in: path
        name: achievement_id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              title: icon
              type: file
          multipart/form-data:
            schema:
              type: object
        description: Icon file
        required: true
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Upload an icon for an achievement
      tags:
      - Achievement
  /achievements/sync:
    post:
      operationId: syncAchievements
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Trigger system achievement sync
      tags:
      - Achievement
  /engagement:
    post:
      description: Add a new engagement or increment existing engagement number
      operationId: AddEngagement
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/EngagementAdd'
                description: Engagement to add
                summary: engagement
        description: Engagement to add
        required: true
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      tags:
      - engagement
  /events:
    get:
      description: Fetches all events
      operationId: GetEvents
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Event'
                type: array
          description: OK
      security:
      - BearerAuth: []
      tags:
      - event
    put:
      description: Creates or updates an event
      operationId: CreateEvent
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/EventCreate'
                description: Event to create
                summary: event
        description: Event to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: Created
      security:
      - BearerAuth: []
      tags:
      - event
  /events/{event_id}:
    delete:
      description: Deletes an event
      operationId: DeleteEvent
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      tags:
      - event
    get:
      description: Fetches an event by id
      operationId: GetEvent
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: OK
      security:
      - BearerAuth: []
      tags:
      - event
  /events/{event_id}/activity:
    get:
      description: Get calculated active times for all users in an event
      operationId: GetEventActivities
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      - description: 'Threshold in seconds to consider a user active before and after
          an activity (default: 300)'
        in: query
        name: threshold_seconds
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                type: object
          description: OK
      security:
      - BearerAuth: []
      tags:
      - activity
  /events/{event_id}/activity/{user_id}:
    get:
      description: Get calculated active times for a user in an event
      operationId: GetEventActivitiesForUser
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      - description: User ID
        in: path
        name: user_id
        required: true
        schema:
          type: integer
      - description: 'Threshold in seconds to consider a user active before and after
          an activity (default: 300)'
        in: query
        name: threshold_seconds
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: integer
          description: OK
      security:
      - BearerAuth: []
      tags:
      - activity
  /events/{event_id}/characters:
    get:
      description: Get all characters for an event
      operationId: GetCharactersForEvent
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BplCharacter'
                type: array
          description: OK
      tags:
      - characters
  /events/{event_id}/duplicate:
    post:
      description: Duplicates an event's configuration
      operationId: DuplicateEvent
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/EventCreate'
                description: Event to create
                summary: event
        description: Event to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: Created
      security:
      - BearerAuth: []
      tags:
      - event
  /events/{event_id}/ladder:
    get:
      description: Get the ladder for an event
      operationId: GetLadder
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      - description: only show ladder entries from this timestamp after event start
        in: query
        name: hours_after_event_start
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LadderEntry'
                type: array
          description: OK
      tags:
      - ladder
  /events/{event_id}/objectives:
    get:
      description: Gets all objectives for an event
      operationId: GetObjectiveTreeForEvent
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
          description: OK
      tags:
      - objective
    put:
      description: Creates a new objective
      operationId: CreateObjective
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ObjectiveCreate'
                description: Objective to create
                summary: objectiveCreate
        description: Objective to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
          description: Created
      security:
      - BearerAuth: []
      tags:
      - objective
  /events/{event_id}/objectives/{id}:
    delete:
      description: Deletes an objective
      operationId: DeleteObjective
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      - description: Objective Id
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      tags:
      - objective
    get:
      description: Gets an objective by id
      operationId: GetObjective
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      - description: Objective Id
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
          description: OK
      security:
      - BearerAuth: []
      tags:
      - objective
  /events/{event_id}/objectives/{id}/copy:
    post:
      description: Copies an objective and all its children onto another objective,
        stripping scoring rules
      operationId: CopyObjective
      parameters:
      - description: Event Id
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      - description: Source Objective Id
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CopyObjectiveRequest'
                description: Copy request
                summary: copyRequest
        description: Copy request
        required: true
